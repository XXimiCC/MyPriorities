<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="telegram:miniapp" content="true" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Куда на самом деле уходит время и личная энергия. Один клик — полчаса жизни."
    />

    <!--
      Установка на домашний экран вне Telegram. Пути внутри самого манифеста
      относительные: его содержимое Vite не переписывает, это просто копия из
      public/, — и абсолютные пути сломали бы обещание base: './' о том, что
      сборка переживает размещение в подкаталоге.

      Картинки собираются из геометрии батареи: npm run brand.
      OG-мет здесь намеренно нет — превью ссылки живёт на лендинге, где есть
      где хранить собственный адрес (og:image обязан быть абсолютным).
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Приоритеты" />

    <title>Мои Приоритеты</title>
    <!-- Классический скрипт, обязательно до модуля: без него window.Telegram не появится. -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
