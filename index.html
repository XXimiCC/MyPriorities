<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="telegram:miniapp" content="true" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Where your time and your own energy actually go. One tap is half an hour of life."
    />

    <!--
      Разметка написана на языке приложения по умолчанию — английском
      (см. pickLocale в src/i18n/index.ts). Заголовок, описание, подпись под
      иконкой и ссылка на манифест переписываются под активный язык на старте и
      при нажатии кнопки в настройках: applyLang() там же. Манифестов поэтому
      два, по одному на локаль, — имя приложения под иконкой берётся из него, и
      иначе перевести его нечем.

      Установка на домашний экран вне Telegram. Пути внутри самого манифеста
      относительные: его содержимое Vite не переписывает, это просто копия из
      public/, — и абсолютные пути сломали бы обещание base: './' о том, что
      сборка переживает размещение в подкаталоге.

      Картинки собираются из геометрии батареи: npm run brand.
      OG-мет здесь намеренно нет — превью ссылки живёт на лендинге, где есть
      где хранить собственный адрес (og:image обязан быть абсолютным).
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Priorities" />

    <title>My Priorities</title>

    <!--
      telegram-web-app.js здесь больше нет. Обычным тегом он блокировал парсер, и
      первый кадр ждал ответа telegram.org — пять секунд задержки чужого CDN один
      в один становились пятью секундами чёрного экрана. Теперь его ставит
      src/telegram/load.ts, и только внутри клиента Telegram, где он нужен.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
