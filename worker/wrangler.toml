name = "mypri"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# Адрес *.workers.dev оставлен включённым намеренно и явно.
#
# Wrangler гасит его сам, как только в конфиге появляется routes: считается, что
# свой домен затем и заводят, чтобы служебного адреса не было. Здесь это рано —
# в приложении на проде адрес Worker зашит в бандл на этапе сборки, и он пока
# старый. Молчаливое отключение обрывает синхронизацию всем, кто открыт прямо
# сейчас, причём без единой ошибки в логах: запрос просто не доходит.
#
# Ключ стоит ДО [[routes]] не по вкусу, а по устройству TOML: после заголовка
# таблицы он стал бы полем внутри маршрута и молча ничего не сделал.
#
# Меняется на false после того, как приложение пересобрано с VITE_SYNC_URL на
# api.mypriorities.life — вместе с чисткой ALLOWED_ORIGINS от адресов Vercel.
workers_dev = true

# Предпросмотры версий выключены.
#
# Cloudflare включает их сам вслед за workers.dev: каждая развёрнутая версия
# получает собственный публичный адрес. Привязки у него те же самые — та же
# база, те же кадры экрана, те же секреты. Значит версия, выкаченная до любой
# починки, остаётся доступной снаружи и после неё, а на вопрос «какой код
# сейчас отвечает на запросы» перестаёт быть один ответ.
#
# Откат к прошлой версии этим не ломается: он делается `wrangler rollback` и
# предпросмотров не требует.
preview_urls = false

# Свой домен для Worker. Заведён в файле, а не кнопкой в панели: адрес — часть
# устройства проекта, и здесь он виден в истории изменений вместе с причиной.
[[routes]]
pattern = "api.mypriorities.life"
custom_domain = true

# Ночной отчёт: размер базы и число операций сообщением от бота. Появляется
# раньше самих данных намеренно — наблюдение, поставленное «потом», не ставится
# никогда, а упереться в тариф и узнать об этом от пользователей дорого.
[triggers]
crons = ["0 3 * * *"]

# Версия развёртывания в /health. Без неё «доехало ли» проверяется только
# заглядыванием в панель, а это ровно тот вопрос, который возникает чаще всего.
[version_metadata]
binding = "CF_VERSION"

[[d1_databases]]
binding = "DB"
database_name = "mypri"
# Подставляется после `wrangler d1 create mypri`.
database_id = "17e95f5f-72b0-4a81-bdc6-d475ba3267cb"

# Кадры экрана из панели отладки. KV, а не R2: гигабайта хватает с запасом при
# потолке в 400 КБ на кадр, срок хранения задаётся прямо при записи, и — в
# отличие от R2 — привязывать к аккаунту карту не нужно.
#
# Подставляется после `wrangler kv namespace create SHOTS`.
[[kv_namespaces]]
binding = "SHOTS"
id = "a9b57f13bddb42519d24387cc310b13a"

[vars]
# Кто может обращаться к Worker из браузера. Список, а не «*»: с «*» браузер
# всё равно не пустит запрос с заголовком авторизации, а дыру открыть можно.
#
# Здесь адрес ПРИЛОЖЕНИЯ, а не Worker: origin — это тот, кто стучится.
# Обратное направление задаётся переменной VITE_SYNC_URL в сборке приложения,
# и туда идёт адрес Worker.
#
# Предпросмотры Vercel живут на адресах со случайным хвостом и сюда не попадают
# намеренно: перечислить их нельзя, а пускать все *.vercel.app — это пускать
# чужие приложения. Для отладки хватает localhost.
#
# Документация и лендинг здесь потому, что панель отладки живёт и на них:
# опечатка в тексте страницы ловится тем же кадром с разметкой, что и баг в
# приложении. Порты 4173 и 5174 — предпросмотр и dev-сервер лендинга.
#
# Адреса *.vercel.app перечислены вместе со своими — на время переезда. Один и
# тот же деплой отвечает сейчас на обоих, и снять служебные адреса раньше, чем
# уйдут последние вкладки, открытые по старой ссылке, значит оборвать их без
# всякого предупреждения. Убираются в уборке, вместе с workers_dev.
#
# www.mypriorities.life здесь не нужен: он отвечает редиректом, и до запуска
# кода браузер оказывается уже на mypriorities.life — origin будет его.
ALLOWED_ORIGINS = "https://mypriorities.life,https://app.mypriorities.life,https://docs.mypriorities.life,https://my-priorities-iota.vercel.app,https://my-priorities-docs.vercel.app,https://my-priorities-landing.vercel.app,http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://localhost:4173"

# Клиент входа через Telegram вне мини-аппа. Совпадает с номером бота и тайной
# не является: тайна — только парный секрет, и он лежит в секретах Worker.
TELEGRAM_CLIENT_ID = "8878708076"

# Кто может присылать тикеты из встроенной панели отладки. Номера Telegram
# через запятую.
#
# Пусто или не задано — не может никто: закрыто по умолчанию, потому что цена
# ошибки в эту сторону — чужие кадры экрана в нашей базе. Здесь, а не в
# секретах: список номеров удостоверением не является, а в файле он виден в
# истории изменений — это ровно то, что про такой список хочется знать.
#
# Свой номер: worker/scripts/chat-id.mjs печатает его вместе с чатом отчёта.
#
# Приглашённые тестировщики сюда НЕ вписываются: собирать у каждого номер
# Telegram — это ровно та возня, из-за которой помогать перестают. Им выдаётся
# ссылка с ключом, см. секрет DEVKIT_INVITE ниже.
DEVKIT_ALLOW = "246112464"

# Секреты сюда НЕ пишутся. Ставятся один раз командой:
#   wrangler secret put TELEGRAM_BOT_TOKEN
#   wrangler secret put JWT_SECRET
#   wrangler secret put REPORT_CHAT_ID
#   wrangler secret put DEVKIT_TOKEN
#   wrangler secret put DEVKIT_INVITE   # ключ из ссылки для тестировщиков

